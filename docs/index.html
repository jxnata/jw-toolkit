<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LS Maps - Gerenciamento de Territórios</title>
		<meta
			name="description"
			content="LS Maps - Aplicativo para facilitar o gerenciamento de territórios e designações para congregações das Testemunhas de Jeová" />
		<link rel="stylesheet" href="styles.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
		<meta name="google-site-verification" content="3ipUg_gUHC8E8gJESX6Bc52zLelgvS_K1KSaIsAs4Y4" />
	</head>
	<body>
		<header class="header">
			<img src="icon.png" alt="LS Maps Logo" class="logo" />
			<h1 class="title">LS Maps</h1>
			<p class="description">
				LS Maps é um aplicativo React Native desenvolvido para facilitar o gerenciamento de territórios e designações para
				congregações das Testemunhas de Jeová. Uma ferramenta completa para organização do serviço de campo.
			</p>
		</header>

		<main class="main">
			<section class="download-section">
				<h2 class="section-title">Baixe o App</h2>
				<div class="download-buttons">
					<a
						href="https://apps.apple.com/in/app/ls-mapas/id6478899478"
						target="_blank"
						rel="noopener noreferrer"
						class="download-btn apple">
						<img src="app-store.svg" alt="Download on the App Store" />
					</a>
					<a
						href="https://play.google.com/store/apps/details?id=dev.jxnata.jwmaps&hl=pt"
						target="_blank"
						rel="noopener noreferrer"
						class="download-btn android">
						<img src="play-store.svg" alt="Get it on Google Play" />
					</a>
				</div>
			</section>

			<section class="links-section">
				<h2 class="section-title">Informações Legais</h2>
				<div class="legal-links">
					<a href="/jw-toolkit/privacy-policy.html" rel="noopener noreferrer" class="legal-link"> Política de Privacidade </a>
					<a href="/jw-toolkit/terms-conditions.html" rel="noopener noreferrer" class="legal-link"> Termos de Uso </a>
				</div>
			</section>
		</main>
	</body>
</html>
